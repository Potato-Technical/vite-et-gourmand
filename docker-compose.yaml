services:
  web:
    build: .
    container_name: vite_et_gourmand_web
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy

  db:
    image: mysql:8.4.11
    container_name: vite_et_gourmand_db
    restart: unless-stopped

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}

    ports:
      - "3307:3306"

    volumes:
      # Stockage des données MySQL
      - db_data:/var/lib/mysql

      # Exécute automatiquement les fichiers SQL au premier démarrage
      - ./database/sql:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  mongo:
    image: mongo:8
    container_name: vite_et_gourmand_mongo
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS}
      MONGO_INITDB_DATABASE: ${MONGO_DB}

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 })'"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  db_data:
  mongo_data:
  vendor_data: